[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true

# Remappings
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "@forge-std/=lib/forge-std/src/"
]

# Somnia Testnet Configuration
[rpc_endpoints]
stt_testnet = "https://data-seed-presomnia-1-s1.somnia.org:8545/"

# Etherscan API for Somnia (SomniaScan)
[etherscan]
stt_testnet = { key = "${SomniaSCAN_API_KEY}", chain = 97, url = "https://api-testnet.somniascan.com/api" }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
